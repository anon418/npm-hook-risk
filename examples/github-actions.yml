name: npm-hook-risk preview

on:
  pull_request:
  workflow_dispatch:

jobs:
  lifecycle-hook-triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install npm-hook-risk preview
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Scan current package
        run: |
          npm-hook-risk scan . --json --output npm-hook-risk-summary.json --strict

      - name: Upload triage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-hook-risk-summary
          path: npm-hook-risk-summary.json
