[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "npm-hook-risk"
version = "0.1.0rc0"
description = "Static review-priority triage for npm lifecycle hooks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "esprima",
]

[project.scripts]
npm-hook-risk = "npm_hook_risk.cli:main"

[tool.setuptools.packages.find]
include = ["npm_hook_risk*", "cli*", "tools*"]
